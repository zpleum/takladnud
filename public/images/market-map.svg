<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ผังตลาดเย็นริมคลอง</title>
  <desc id="desc">ผังตัวอย่าง มีแถวแผงค้าหกแถว ทางเดินกลาง และเวทีชุมชน</desc>
  <defs>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#203a32"/><stop offset="1" stop-color="#142821"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r="1" fill="#d8c58b" opacity=".12"/><circle cx="19" cy="20" r="1.4" fill="#b6d0b5" opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="800" rx="34" fill="url(#ground)"/><rect width="1200" height="800" rx="34" fill="url(#grain)"/>
  <path d="M48 400H1152" stroke="#d6be80" stroke-width="5" stroke-dasharray="20 18" opacity=".5"/>
  <path d="M595 90V710" stroke="#bdd0b2" stroke-width="3" stroke-dasharray="12 16" opacity=".25"/>
  <g fill="#d8c58b" font-family="sans-serif" font-size="24" font-weight="600" opacity=".8">
    <text x="525" y="394">ทางเดินหลัก</text><text x="88" y="754">ทางเข้าตลาด</text><text x="973" y="754">ลานชุมชน</text>
  </g>
  <g fill="#aec9a9" opacity=".65">
    <circle cx="82" cy="90" r="10"/><circle cx="1118" cy="90" r="10"/><circle cx="82" cy="710" r="10"/><circle cx="1118" cy="710" r="10"/>
